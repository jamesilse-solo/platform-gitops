apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-project
  namespace: argocd
spec:
  description: Platform GitOps Project — manages nginx, node-app, Istio config, and Kyverno policies

  sourceRepos:
    - git@github.com:maheshnaganna1994-lang/platform-gitops.git
    - https://kyverno.github.io/kyverno/

  destinations:
    - namespace: default
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: argo-rollouts
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
    - group: networking.istio.io
      kind: Gateway
    - group: networking.istio.io
      kind: VirtualService
    - group: networking.istio.io
      kind: DestinationRule
    - group: security.istio.io
      kind: AuthorizationPolicy
    - group: security.istio.io
      kind: PeerAuthentication
    - group: kyverno.io
      kind: ClusterPolicy
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: ''
      kind: Namespace
