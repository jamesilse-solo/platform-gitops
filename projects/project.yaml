apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-project
  namespace: argocd
spec:
  description: Platform GitOps Project — manages nginx, node-app, Ambient config, AgentGateway config, and Kyverno policies

  sourceRepos:
    - https://github.com/jamesilse-solo/platform-gitops.git
    - https://kyverno.github.io/kyverno/

  destinations:
    - namespace: default
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: argo-rollouts
      server: https://kubernetes.default.svc
    - namespace: agentgateway-system
      server: https://kubernetes.default.svc
    - namespace: istio-system
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
    - group: argoproj.io
      kind: AnalysisRun
    # Ambient mesh policy (waypoint deploys via Gateway API)
    - group: security.istio.io
      kind: AuthorizationPolicy
    - group: security.istio.io
      kind: PeerAuthentication
    # Gateway API — used by both AgentGateway (north-south) and the ambient waypoint (east-west L7)
    - group: gateway.networking.k8s.io
      kind: Gateway
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: gateway.networking.k8s.io
      kind: ReferenceGrant
    - group: kyverno.io
      kind: ClusterPolicy
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: ''
      kind: Namespace
