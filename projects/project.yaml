apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-project
  namespace: argocd
spec:
  description: Platform GitOps Project — manages nginx, node-app, Ambient config, AgentGateway config, and Kyverno policies

  sourceRepos:
    - https://github.com/jamesilse-solo/platform-gitops.git
    - https://kyverno.github.io/kyverno/

  destinations:
    - namespace: default
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: argo-rollouts
      server: https://kubernetes.default.svc
    - namespace: agentgateway-system
      server: https://kubernetes.default.svc
    - namespace: istio-system
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    # Wide open at the cluster scope — this is a demo project and Kyverno,
    # Argo Rollouts, and Istio Ambient all bring in their own RBAC, webhook,
    # and APIService cluster-scoped resources. Narrow the destinations
    # (see above) if you need to constrain blast radius.
    - group: '*'
      kind: '*'
