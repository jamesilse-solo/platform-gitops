apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  validationFailureAction: enforce
  background: true
  rules:
    - name: check-limits
      match:
        resources:
          kinds:
            - Deployment
            - StatefulSet
            - DaemonSet
            - Job
      exclude:
        resources:
          namespaces:
            - kube-system
            - default
            - kyverno
            - istio-system
      validate:
        message: "CPU and memory limits are required for all containers except Istio sidecars."
        foreach:
          - list: "request.object.spec.template.spec.containers"
            # This skips the check if the container is the Istio sidecar
            preconditions:
              all:
              - key: "{{ element.name }}"
                operator: NotEquals
                value: istio-proxy
        pattern:
          spec:
            template:
              spec:
                containers:
                  - resources:
                      limits:
                        cpu: "?*"
                        memory: "?*"

