apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx-chart

  policyTypes:
    - Ingress
    - Egress

  ingress:
  # ✅ Allow traffic to nginx from same namespace (testing)
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 80

  # ✅ Allow Istio control plane → nginx
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system
    ports:
    - protocol: TCP
      port: 15006   # sidecar inbound

  egress:
  # ✅ Allow nginx → nginx (self communication if needed)
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: nginx-chart
    ports:
    - protocol: TCP
      port: 80

  # 🔥 VERY IMPORTANT → allow Istio control plane
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system
    ports:
    - protocol: TCP
      port: 15012   # istiod
    - protocol: TCP
      port: 15010   # fallback
