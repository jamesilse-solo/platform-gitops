apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: node-app-vs
  namespace: default

spec:
  hosts:
    - "*"

  gateways:
    - nginx-gateway

  http:
    - name: primary
      route:
        - destination:
            host: node-app-stable
            port:
              number: 80
          weight: 100

        - destination:
            host: node-app-canary
            port:
              number: 80
          weight: 0
