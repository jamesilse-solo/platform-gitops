apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: main-routing
spec:
  hosts:
    - "*"
  gateways:
    - nginx-gateway
  http:
    - match:
        - uri:
            prefix: /node
      route:
        - destination:
            host: node-app.default.svc.cluster.local
            port:
              number: 80

    - match:
        - uri:
            prefix: /node
      route:
        - destination:
            host: node-app.default.svc.cluster.local
            subset: v1
            port:
              number: 80
          weight: 90
      - destination:
          host: node-app.default.svc.cluster.local
          subset: v2
          port:
            number: 80
        weight: 10
