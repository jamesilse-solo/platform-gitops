apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: main-routing
spec:
  hosts:
    - "*"
  gateways:
    - nginx-gateway
  http:
    - match:
        - uri:
            prefix: /node
      route:
        - destination:
            host: node-app.default.svc.cluster.local
            port:
              number: 80

    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: nginx-app-nginx-chart.default.svc.cluster.local
            port:
              number: 80
