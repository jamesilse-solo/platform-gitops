apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  namespace: argocd
spec:
  project: platform-project
  source:
    repoURL: https://github.com/jamesilse-solo/platform-gitops.git
    path: policies
    targetRevision: ambient-agentgateway
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
