apiVersion: v1
kind: Service
metadata:
  name: node-app-stable
  namespace: default
spec:
  selector:
    app: node-app
    version: stable
  ports:
  - port: 80
    targetPort: 5678

---
apiVersion: v1
kind: Service
metadata:
  name: node-app-canary
  namespace: default
spec:
  selector:
    app: node-app
    version: canary
  ports:
  - port: 80
    targetPort: 5678
