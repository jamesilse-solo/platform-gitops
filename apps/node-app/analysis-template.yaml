apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-check
  namespace: default
spec:
  metrics:
  - name: success-rate
    interval: 30s
    count: 3
    # 1. len(result) == 0  -> Safe if there is no traffic at all (empty prometheus array)
    # 2. isNaN(result[0])   -> Safe if traffic is 0/0 (Prometheus returns NaN)
    # 3. result[0] >= 0.95 -> Evaluates the actual value correctly as a float64
    successCondition: "len(result) == 0 || isNaN(result[0]) || result[0] >= 0.95"
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus.istio-system.svc.cluster.local:9090
        query: |
          sum(rate(istio_requests_total{
            destination_service_name="node-app-canary",
            response_code!~"5.*"
          }[2m]))
          /
          sum(rate(istio_requests_total{
            destination_service_name="node-app-canary"
          }[2m]))
