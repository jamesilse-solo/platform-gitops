apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-check
  namespace: default
spec:
  metrics:
  - name: success-rate
    interval: 30s
    count: 3
    successCondition: "len(result) == 0 || isNaN(result[0]) || result[0] >= 0.95"
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus.istio-system.svc.cluster.local:9090
        # `istio_requests_total` is emitted by the ambient waypoint proxy
        # (see ambient/waypoint.yaml). Without a waypoint on the default
        # namespace, the ztunnel would only emit L4 metrics and this query
        # would return no results.
        query: |
          sum(rate(istio_requests_total{
            reporter="waypoint",
            destination_service="node-app-canary.default.svc.cluster.local",
            response_code!~"5.*"
          }[2m]))
          /
          on() group_left()
          (sum(rate(istio_requests_total{
            reporter="waypoint",
            destination_service="node-app-canary.default.svc.cluster.local"
          }[2m])) > 0)
