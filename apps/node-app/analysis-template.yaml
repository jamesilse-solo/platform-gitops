apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-check
  namespace: default
spec:
  metrics:
  - name: success-rate
    interval: 30s
    count: 3
    # If no traffic (NaN), evaluate as true. If traffic exists, require >= 95% success.
    successCondition: "isNaN(result) || result >= 0.95"
    failureLimit: 3
    provider:
      prometheus:
        address: http://cluster.local
        query: |
          sum(rate(istio_requests_total{
            destination_service_name="node-app-canary",
            response_code!~"5.*"
          }[2m]))
          /
          sum(rate(istio_requests_total{
            destination_service_name="node-app-canary"
          }[2m]))
