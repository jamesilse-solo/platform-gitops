apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-config
  namespace: argocd
spec:
  project: platform-project
  source:
    repoURL: git@github.com:maheshnaganna1994-lang/platform-gitops.git
    targetRevision: main
    path: istio
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
