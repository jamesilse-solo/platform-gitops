apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: platform-project
  source:
    repoURL: https://github.io
    chart: kyverno
    targetRevision: 3.0.0 # Use the version you have currently
  destination:
    server: https://default.svc
    namespace: kyverno

  # --- THIS SECTION IGNORES THE MASSIVE ANNOTATIONS ---
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # --- THIS FIXES THE "METADATA TOO LONG" ERROR ---
      - ServerSideApply=true
