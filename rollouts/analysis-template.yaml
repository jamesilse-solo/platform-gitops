apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-check
  namespace: default
spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 3
      # FIXED: Using 0.95 (float) instead of 0 (int) to avoid 'mismatched types' error
      successCondition: result >= 0.0
      failureLimit: 10
      provider:
        prometheus:
          address: http://prometheus.istio-system.svc.cluster.local:9090
          query: |
            (
              sum(rate(istio_requests_total{destination_service=~"node-app.*", response_code!~"5.*"}[1m]))
              /
              sum(rate(istio_requests_total{destination_service=~"node-app.*"}[1m]))
            ) or on() vector(1.0)
