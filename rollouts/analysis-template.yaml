apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-check
spec:
  metrics:
  - name: success-rate
    interval: 30s
    count: 3
    # Passes if there are no requests yet (len == 0) OR success rate >= 95%
    successCondition: len(result) == 0 || result[0] >= 0.95
    failureLimit: 10
    provider:
      prometheus:
        # Update this to your actual Prometheus service address
        # Common pattern: http://prometheus-operated.<namespace>.svc.cluster.local:9090
        address: http://prometheus-operated.monitoring.svc.cluster.local:9090
        query: |
          (
            sum(irate(istio_requests_total{destination_service=~"node-app.*",response_code!~"5.*"}[1m]))
            /
            sum(irate(istio_requests_total{destination_service=~"node-app.*"}[1m]))
          ) or on() vector(1)
