apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-check
  namespace: default
spec:
  metrics:
  - name: success-rate
    interval: 30s
    count: 3  # Add this! It will check 3 times (90 seconds total) then pass
    successCondition: default(result, 1) >= 0.95
    failureLimit: 1
    provider:
      prometheus:
        address: http://cluster.local
        query: |
          sum(rate(istio_requests_total{destination_service=~"node-app.*",response_code!~"5.*"}[1m]))
          /
          sum(rate(istio_requests_total{destination_service=~"node-app.*"}[1m]))
