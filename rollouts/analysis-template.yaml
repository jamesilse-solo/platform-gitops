apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-check
spec:
  metrics:
  - name: success-rate
    interval: 30s
    count: 3
    # Use result[0] to target the numeric value correctly
    successCondition: len(result) == 0 || result[0] >= 0.95
    failureLimit: 10
    provider:
      prometheus:
        address: http://cluster.local
        query: |
          (
            sum(irate(istio_requests_total{destination_service=~"node-app.*",response_code!~"5.*"}[1m]))
            /
            sum(irate(istio_requests_total{destination_service=~"node-app.*"}[1m]))
          ) or on() vector(1)
