apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-node-app
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: node-app-stable
    - group: ""
      kind: Service
      name: node-app-canary
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              # north-south ingress (Solo Enterprise AgentGateway)
              - cluster.local/ns/agentgateway-system/sa/agentgateway
              # OSS agentgateway workload — proxies /oss/* → node-app-stable
              - cluster.local/ns/default/sa/agentgateway-oss-agentgateway-oss-chart
